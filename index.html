<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111615">
  <meta name="description" content="Tower Clash is a fast, competitive quiz game. Answer fast, build high, and take the crown.">
  <title>Tower Clash — Build higher. Answer faster.</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');

    :root {
      color-scheme: dark;
      --ink: #eff2e9;
      --muted: #9ba69d;
      --bg: #111615;
      --panel: #1b2220;
      --panel-2: #222b28;
      --line: rgba(235, 243, 229, .12);
      --lime: #d3f36b;
      --lime-dark: #a7cd3d;
      --orange: #ff8059;
      --cyan: #76ddcf;
      --purple: #bd9dff;
      --danger: #ff6f72;
      --mono: "DM Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
      --sans: "Manrope", Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 87% 2%, rgba(101, 151, 108, .12), transparent 34rem),
        radial-gradient(ellipse at 4% 55%, rgba(80, 120, 99, .08), transparent 32rem),
        var(--bg);
    }
    button, input, select { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--lime);
      outline-offset: 3px;
    }
    button { cursor: pointer; }
    .app-shell { width: min(1240px, calc(100% - 48px)); margin: 0 auto; }
    .topbar {
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      border: 0;
      padding: 0;
      background: transparent;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -.04em;
    }
    .brand-mark {
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: #172012;
      background: var(--lime);
      transform: rotate(-5deg);
    }
    .brand-mark svg { width: 19px; height: 19px; }
    .brand span:last-child { color: var(--lime); }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .nav-note { font-size: 12px; color: var(--muted); }
    .language-select {
      min-height: 38px; padding: 0 10px; border: 1px solid var(--line); border-radius: 9px;
      background: rgba(255,255,255,.035); color: var(--ink); font-size: 11px; font-weight: 800;
    }
    .icon-button, .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: transparent;
      transition: transform .16s ease, background .16s ease, border-color .16s ease;
    }
    .icon-button { min-width: 42px; height: 42px; }
    .icon-button:hover, .button:hover { transform: translateY(-2px); border-color: rgba(211,243,107,.5); }
    .button { min-height: 46px; padding: 0 18px; font-size: 13px; font-weight: 800; }
    .button-primary { border-color: var(--lime); background: var(--lime); color: #172012; }
    .button-primary:hover { background: #e1fb8b; }
    .button-secondary { background: rgba(255,255,255,.035); }
    .button-quiet { border-color: transparent; color: var(--muted); }
    .button-small { min-height: 37px; padding: 0 13px; font-size: 11px; }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--lime);
      font: 11px var(--mono);
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 7px; height: 7px; background: var(--lime); border-radius: 2px; transform: rotate(45deg); }
    .hero {
      display: grid;
      grid-template-columns: minmax(0, .94fr) minmax(420px, 1.06fr);
      align-items: center;
      gap: 62px;
      padding: 74px 0 72px;
      min-height: 570px;
    }
    h1, h2, h3, p { margin-top: 0; }
    .hero h1 {
      max-width: 570px;
      margin: 20px 0 18px;
      font-size: clamp(48px, 6vw, 77px);
      line-height: .99;
      letter-spacing: -.075em;
      font-weight: 800;
    }
    .hero h1 span { color: var(--lime); }
    .hero-copy {
      max-width: 430px;
      margin-bottom: 27px;
      color: #aab4aa;
      font-size: 15px;
      line-height: 1.75;
    }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 11px; }
    .hero-actions .button { min-height: 51px; padding: 0 21px; }
    .hero-footnote { margin: 18px 0 0; color: #818d83; font-size: 11px; }
    .hero-footnote span { color: var(--lime); }

    .arena-preview {
      position: relative;
      min-height: 414px;
      padding: 23px 24px 20px;
      overflow: hidden;
      border: 1px solid rgba(226,240,218,.12);
      border-radius: 19px;
      background:
        linear-gradient(rgba(226,240,218,.032) 1px, transparent 1px),
        linear-gradient(90deg, rgba(226,240,218,.032) 1px, transparent 1px),
        radial-gradient(ellipse at 50% 70%, rgba(143,179,93,.13), transparent 55%),
        #18201d;
      background-size: 28px 28px, 28px 28px, auto, auto;
      box-shadow: 0 28px 80px rgba(0,0,0,.24);
    }
    .preview-top { display: flex; justify-content: space-between; align-items: center; }
    .preview-label { color: #aab5aa; font: 10px var(--mono); letter-spacing: .12em; }
    .live-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 9px; border: 1px solid rgba(211,243,107,.24); border-radius: 99px;
      color: var(--lime); font: 9px var(--mono); letter-spacing: .07em;
    }
    .live-pill::before { content: ""; width: 6px; height: 6px; background: var(--lime); border-radius: 50%; box-shadow: 0 0 10px var(--lime); }
    .preview-question {
      position: relative; z-index: 1;
      width: fit-content; max-width: 94%;
      margin: 23px auto 0; padding: 10px 14px;
      border: 1px solid rgba(255,255,255,.1); border-radius: 10px;
      background: rgba(15,21,19,.78); text-align: center;
      font-size: 12px; font-weight: 700;
    }
    .preview-question small { display: block; margin-bottom: 4px; color: var(--lime); font: 9px var(--mono); letter-spacing: .08em; }
    .preview-towers {
      position: absolute; inset: auto 18px 44px;
      height: 205px; display: flex; align-items: end; justify-content: space-around;
      border-bottom: 1px solid rgba(219,232,216,.22);
    }
    .preview-player { width: 22%; display: flex; flex-direction: column; align-items: center; gap: 9px; }
    .tower {
      display: flex; flex-direction: column-reverse; gap: 3px;
      width: 65px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.28));
      animation: tower-in .6s cubic-bezier(.2,.8,.2,1) both;
    }
    .tower .floor {
      position: relative; height: 14px; border: 1px solid rgba(255,255,255,.18); border-radius: 3px;
      background: linear-gradient(90deg, var(--tower-color), color-mix(in srgb, var(--tower-color), #fff 24%));
    }
    .tower .floor:nth-child(3n)::after {
      content: ""; position: absolute; right: 6px; top: 3px; width: 5px; height: 5px;
      border-radius: 1px; background: rgba(13,20,16,.48);
    }
    .tower .floor.reinforced { border-color: #fff3a0; box-shadow: 0 0 7px rgba(255,243,160,.28); }
    .tower-name { font: 9px var(--mono); color: #b7c1b6; }
    .tower-height { color: var(--ink); font-size: 11px; font-weight: 800; }
    .preview-player:nth-child(1) { --tower-color: #d1ed70; }
    .preview-player:nth-child(2) { --tower-color: #79d8ca; }
    .preview-player:nth-child(3) { --tower-color: #ff8a64; }
    .preview-player:nth-child(4) { --tower-color: #b69af7; }
    .preview-player:nth-child(1) .tower { height: 154px; }
    .preview-player:nth-child(2) .tower { height: 116px; }
    .preview-player:nth-child(3) .tower { height: 92px; }
    .preview-player:nth-child(4) .tower { height: 72px; }
    .preview-floor { flex: 1; }
    .preview-toast {
      position: absolute; z-index: 2; right: 20px; top: 144px;
      padding: 9px 11px; border: 1px solid rgba(211,243,107,.32); border-radius: 8px;
      background: #222d25; color: var(--lime); font: 10px var(--mono);
      animation: float 2.5s ease-in-out infinite;
    }
    .preview-toast::before { content: "↗ "; }
    .preview-bottom { position: absolute; left: 22px; right: 22px; bottom: 14px; display: flex; justify-content: space-between; color: #8d998f; font: 9px var(--mono); }

    .how-section { padding: 27px 0 72px; }
    .section-heading { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 23px; }
    .section-heading h2 { margin: 9px 0 0; font-size: 25px; letter-spacing: -.05em; }
    .section-heading p { max-width: 330px; margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 11px; }
    .step {
      min-height: 126px; padding: 17px 18px; border: 1px solid var(--line); border-radius: 13px;
      background: rgba(255,255,255,.025);
    }
    .step-num { color: var(--lime); font: 10px var(--mono); }
    .step h3 { margin: 19px 0 4px; font-size: 14px; letter-spacing: -.03em; }
    .step p { margin: 0; color: var(--muted); font-size: 11px; }
    .footer { display: flex; justify-content: space-between; padding: 20px 0 27px; border-top: 1px solid var(--line); color: #77837a; font-size: 10px; }
    .footer b { color: #c6d0c4; }

    .page { padding: 38px 0 70px; min-height: calc(100vh - 83px); }
    .page-title { margin: 13px 0 7px; font-size: clamp(30px, 4vw, 43px); letter-spacing: -.065em; }
    .page-subtitle { color: var(--muted); font-size: 13px; line-height: 1.6; }
    .setup-layout { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(260px, .8fr); gap: 20px; margin-top: 28px; }
    .panel { border: 1px solid var(--line); border-radius: 15px; background: rgba(27,34,32,.92); }
    .panel-pad { padding: 22px; }
    .panel-heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .panel-heading h2 { margin: 0; font-size: 15px; letter-spacing: -.03em; }
    .field { display: grid; gap: 7px; margin-bottom: 17px; }
    .field label { color: #c9d2c8; font-size: 11px; font-weight: 700; }
    .field input, .field select, .text-input {
      width: 100%; min-height: 44px; padding: 0 13px; border: 1px solid rgba(233,242,229,.13);
      border-radius: 9px; background: #131a17; color: var(--ink); font-size: 13px;
    }
    .field select { color-scheme: dark; }
    .field-hint { color: #7f8a81; font-size: 10px; }
    .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 13px 0; border-top: 1px solid var(--line); }
    .setting-copy b { display: block; font-size: 12px; }
    .setting-copy span { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; }
    .switch { position: relative; flex: 0 0 39px; width: 39px; height: 23px; border: 0; border-radius: 99px; background: #47504a; transition: background .2s; }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 17px; height: 17px; border-radius: 50%; background: #f0f3e8; transition: transform .2s; }
    .switch[aria-checked="true"] { background: var(--lime-dark); }
    .switch[aria-checked="true"]::after { transform: translateX(16px); background: #172012; }
    .summary-list { display: grid; gap: 0; margin: 15px 0 20px; }
    .summary-line { display: flex; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 11px; color: var(--muted); }
    .summary-line strong { color: var(--ink); font-weight: 700; }
    .full-width { width: 100%; }
    .notice { margin-top: 14px; padding: 11px 12px; border-radius: 9px; background: rgba(211,243,107,.07); color: #b5c5a1; font-size: 10px; line-height: 1.55; }
    .notice strong { color: var(--lime); }

    .lobby-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; margin-top: 23px; }
    .lobby-stage {
      min-height: 390px; padding: 25px; overflow: hidden; position: relative;
      background:
        linear-gradient(rgba(226,240,218,.026) 1px, transparent 1px),
        linear-gradient(90deg, rgba(226,240,218,.026) 1px, transparent 1px),
        radial-gradient(ellipse at 50% 80%, rgba(143,179,93,.13), transparent 55%), #18201d;
      background-size: 28px 28px, 28px 28px, auto, auto;
    }
    .lobby-code { margin: 43px 0 4px; color: var(--lime); font: 800 clamp(40px,7vw,68px)/1 var(--mono); letter-spacing: .1em; }
    .code-caption { color: #a6b0a7; font: 10px var(--mono); letter-spacing: .08em; }
    .lobby-players { display: flex; flex-wrap: wrap; gap: 8px; margin: 25px 0; }
    .player-chip { display: inline-flex; align-items: center; gap: 8px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: rgba(7,12,10,.5); font-size: 11px; }
    .player-chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--player-color,var(--lime)); }
    .lobby-card { padding: 20px; }
    .lobby-card h3 { margin: 0 0 5px; font-size: 14px; }
    .lobby-card p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .lobby-stat { display: flex; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 11px; }
    .lobby-stat span { color: var(--muted); }
    .lobby-actions { display: grid; gap: 9px; margin-top: 17px; }

    .join-wrap { display: grid; place-items: center; min-height: calc(100vh - 165px); }
    .join-card { width: min(430px,100%); padding: 27px; }
    .join-card .brand-mark { margin-bottom: 25px; }
    .join-card h1 { margin: 0 0 8px; font-size: 32px; letter-spacing: -.06em; }
    .join-card .page-subtitle { margin-bottom: 24px; }
    .code-input { font: 20px var(--mono) !important; letter-spacing: .14em; }
    .error-message { min-height: 17px; margin: -7px 0 9px; color: var(--danger); font-size: 11px; }

    .game-topline { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 17px; }
    .game-status { display: inline-flex; align-items: center; gap: 8px; color: var(--lime); font: 10px var(--mono); letter-spacing: .08em; }
    .game-status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .game-controls { display: flex; gap: 7px; flex-wrap: wrap; justify-content: end; }
    .game-grid { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 16px; }
    .arena-panel {
      position: relative; min-height: 360px; overflow: hidden; padding: 20px;
      background:
        linear-gradient(rgba(226,240,218,.026) 1px, transparent 1px),
        linear-gradient(90deg, rgba(226,240,218,.026) 1px, transparent 1px),
        radial-gradient(ellipse at 50% 85%, rgba(143,179,93,.13), transparent 55%), #18201d;
      background-size: 28px 28px, 28px 28px, auto, auto;
    }
    .arena-header { display: flex; align-items: center; justify-content: space-between; color: #a9b5aa; font: 10px var(--mono); letter-spacing: .08em; }
    .timer { color: var(--ink); font: 700 15px var(--mono); }
    .timer.urgent { color: var(--orange); animation: pulse 1s infinite; }
    .tower-row {
      position: absolute; inset: 62px 18px 37px; display: flex; align-items: end; justify-content: space-around;
      border-bottom: 1px solid rgba(219,232,216,.22); gap: 6px;
    }
    .game-tower-card { min-width: 0; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: end; gap: 8px; height: 100%; }
    .game-tower { width: min(52px,70%); display: flex; flex-direction: column-reverse; gap: 2px; min-height: 4px; transition: height .35s ease; }
    .game-tower .floor { position: relative; height: 12px; flex: 0 0 12px; border-radius: 2px; background: linear-gradient(90deg,var(--tower-color),color-mix(in srgb,var(--tower-color),#fff 23%)); border: 1px solid rgba(255,255,255,.16); animation: tower-in .32s ease both; }
    .game-tower .floor::after { content: ""; position: absolute; right: 5px; top: 3px; width: 4px; height: 4px; background: rgba(10,17,13,.4); border-radius: 1px; }
    .game-tower .floor.reinforced { border-color: #fff0a0; box-shadow: 0 0 6px rgba(255,240,160,.3); }
    .game-tower-card.target .game-tower { animation: hit .35s ease; }
    .tower-name-game { max-width: 100%; overflow: hidden; color: #c7d0c6; font: 9px var(--mono); text-overflow: ellipsis; white-space: nowrap; }
    .tower-score { font: 800 13px var(--sans); }
    .leader-crown { color: var(--lime); font-size: 10px; min-height: 12px; }
    .shield-badge { position: absolute; margin-top: -19px; color: var(--cyan); font-size: 11px; }
    .question-panel { padding: 19px; }
    .question-meta { display: flex; justify-content: space-between; gap: 10px; color: #8f9b91; font: 9px var(--mono); letter-spacing: .07em; text-transform: uppercase; }
    .question-text { margin: 15px 0 16px; font-size: 19px; line-height: 1.35; letter-spacing: -.045em; }
    .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .answer {
      min-height: 56px; padding: 9px 10px; display: flex; align-items: center; gap: 9px;
      border: 1px solid var(--line); border-radius: 9px; background: #202825; text-align: left;
      font-size: 11px; font-weight: 700; transition: transform .12s, border-color .12s, background .12s;
    }
    .answer:hover:not(:disabled) { transform: translateY(-2px); border-color: rgba(211,243,107,.5); }
    .answer:active:not(:disabled) { transform: scale(.98); }
    .answer:disabled { cursor: default; opacity: .8; }
    .answer-key { flex: 0 0 22px; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 6px; background: rgba(255,255,255,.08); color: #a8b2a8; font: 10px var(--mono); }
    .answer.correct { border-color: rgba(211,243,107,.55); background: rgba(211,243,107,.1); }
    .answer.incorrect { border-color: rgba(255,111,114,.45); background: rgba(255,111,114,.1); }
    .answer-feedback { min-height: 22px; margin: 11px 0 0; color: var(--muted); font-size: 11px; }
    .answer-feedback.good { color: var(--lime); font-weight: 800; }
    .answer-feedback.bad { color: var(--orange); font-weight: 800; }
    .action-panel { display: none; margin-top: 12px; padding: 12px; border: 1px solid rgba(211,243,107,.24); border-radius: 10px; background: rgba(211,243,107,.05); }
    .action-panel.active { display: block; animation: rise .2s ease both; }
    .action-title { margin-bottom: 9px; color: var(--lime); font: 10px var(--mono); letter-spacing: .08em; }
    .action-buttons { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; }
    .action-button { min-height: 40px; padding: 5px; border: 1px solid var(--line); border-radius: 7px; background: #202825; font-size: 9px; font-weight: 800; }
    .action-button:hover { border-color: var(--lime); }
    .action-hint { margin: 9px 0 0; color: #8d998f; font-size: 9px; }
    .side-panel { padding: 17px; }
    .side-heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 13px; }
    .side-heading h2 { margin: 0; font-size: 13px; }
    .side-heading span { color: #8c988e; font: 9px var(--mono); }
    .rank-list { display: grid; gap: 3px; }
    .rank-item { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 7px; padding: 9px 6px; border-bottom: 1px solid rgba(233,242,229,.07); }
    .rank-num { color: #879288; font: 10px var(--mono); }
    .rank-item:first-child .rank-num { color: var(--lime); }
    .rank-name { overflow: hidden; font-size: 10px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .rank-item.you .rank-name::after { content: " YOU"; color: var(--lime); font: 8px var(--mono); }
    .rank-height { color: #c8d2c7; font: 10px var(--mono); }
    .streak-card { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding: 11px; border-radius: 9px; background: rgba(255,128,89,.08); }
    .streak-card span { color: #b7a89d; font-size: 10px; }
    .streak-card strong { color: var(--orange); font: 700 13px var(--mono); }
    .side-note { margin: 13px 0 0; color: #818d83; font-size: 9px; line-height: 1.55; }
    .toast {
      position: fixed; left: 50%; bottom: 24px; z-index: 20; transform: translate(-50%,20px);
      padding: 12px 16px; border: 1px solid rgba(211,243,107,.28); border-radius: 10px;
      background: #273128; color: var(--lime); font-size: 12px; font-weight: 800;
      opacity: 0; pointer-events: none; transition: .2s ease;
    }
    .toast.show { transform: translate(-50%,0); opacity: 1; }
    .result-hero { padding: 30px 22px; text-align: center; }
    .winner-mark { width: 58px; height: 58px; display: grid; place-items: center; margin: 0 auto 15px; border: 1px solid rgba(211,243,107,.35); border-radius: 18px; background: rgba(211,243,107,.1); color: var(--lime); font-size: 27px; }
    .result-hero h1 { margin: 9px 0; font-size: clamp(34px,6vw,54px); letter-spacing: -.07em; }
    .winner-name { color: var(--lime); }
    .winner-stat { color: #aab5aa; font: 11px var(--mono); }
    .podium { display: grid; grid-template-columns: repeat(3,1fr); gap: 9px; margin-top: 21px; text-align: left; }
    .podium-item { padding: 15px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.025); }
    .podium-item small { color: var(--lime); font: 9px var(--mono); }
    .podium-item strong { display: block; margin: 7px 0 3px; font-size: 13px; }
    .podium-item span { color: var(--muted); font: 10px var(--mono); }
    .result-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 9px; margin-top: 22px; }
    .paused-banner { margin-bottom: 13px; padding: 9px; border: 1px solid rgba(255,128,89,.25); border-radius: 8px; color: var(--orange); text-align: center; font: 10px var(--mono); }
    .hidden { display: none !important; }
    @keyframes tower-in { from { opacity: .2; transform: translateY(9px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes pulse { 50% { opacity: .55; } }
    @keyframes hit { 25% { transform: translateX(-4px) rotate(-2deg); } 50% { transform: translateX(4px) rotate(2deg); } 75% { transform: translateX(-2px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 900px) {
      .hero { grid-template-columns: 1fr; gap: 34px; padding: 56px 0 50px; }
      .hero-copy { max-width: 540px; }
      .arena-preview { width: min(100%,650px); justify-self: center; }
      .setup-layout { grid-template-columns: 1fr; }
      .lobby-grid { grid-template-columns: 1fr; }
      .game-grid { grid-template-columns: 1fr; }
      .side-panel { order: 2; }
      .rank-list { grid-template-columns: repeat(2,1fr); }
    }
    @media (max-width: 600px) {
      .app-shell { width: min(100% - 30px,1240px); }
      .topbar { height: 68px; }
      .nav-note { display: none; }
      .brand { gap: 7px; font-size: 12px; }
      .brand-mark { width: 28px; height: 28px; }
      .nav-right .button { min-height: 37px; padding: 0 7px; font-size: 9px; }
      .nav-right { gap: 6px; }
      .language-select { min-height: 35px; padding: 0 4px; font-size: 9px; }
      .hero { min-height: 0; padding: 49px 0 41px; gap: 27px; }
      .hero h1 { font-size: clamp(47px,14vw,68px); }
      .hero-copy { font-size: 13px; }
      .arena-preview { min-height: 350px; padding: 18px 15px; }
      .preview-towers { inset-inline: 8px; height: 172px; }
      .preview-player:nth-child(1) .tower { height: 128px; }
      .preview-player:nth-child(2) .tower { height: 100px; }
      .preview-player:nth-child(3) .tower { height: 78px; }
      .preview-player:nth-child(4) .tower { height: 60px; }
      .tower { width: 48px; }
      .tower .floor { height: 11px; }
      .preview-toast { right: 12px; top: 124px; }
      .section-heading { display: block; }
      .section-heading p { margin-top: 9px; }
      .steps { grid-template-columns: 1fr 1fr; }
      .step { min-height: 112px; padding: 14px; }
      .step h3 { margin-top: 14px; }
      .footer { gap: 12px; font-size: 9px; }
      .page { padding-top: 28px; }
      .panel-pad { padding: 17px; }
      .lobby-stage { min-height: 340px; padding: 19px; }
      .lobby-code { margin-top: 46px; font-size: 43px; }
      .game-topline { align-items: flex-start; }
      .game-controls .button { min-height: 34px; padding: 0 9px; font-size: 9px; }
      .arena-panel { min-height: 300px; padding: 14px; }
      .tower-row { inset: 58px 8px 34px; }
      .game-tower { width: min(38px,80%); }
      .game-tower .floor { height: 10px; flex-basis: 10px; }
      .tower-name-game { font-size: 8px; }
      .question-panel { padding: 15px; }
      .question-text { font-size: 17px; }
      .answers { grid-template-columns: 1fr; gap: 7px; }
      .answer { min-height: 48px; }
      .action-buttons { grid-template-columns: repeat(2,1fr); }
      .rank-list { grid-template-columns: 1fr 1fr; }
      .side-panel { padding: 14px; }
      .podium { grid-template-columns: 1fr; }
      .podium-item { display: flex; align-items: center; gap: 12px; }
      .podium-item strong { margin: 0; flex: 1; }
      .result-hero { padding: 22px 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }

        const error = form.querySelector("#join-error");
        if (state.code && code === state.code && state.status !== "finished") {
          if (state.players.some((player) => player.name.toLowerCase() === name.toLowerCase())) {
            error.textContent = translateDynamic("That nickname is already in this room.");
            return;
          }
          const guest = makePlayer(name, 0, state.players.length, false);
          state.players.push(guest);
          state.localId = guest.id;
          if (state.status === "playing") {
            state.screen = "game";
            state.answerLocked = false;
            state.hasReward = false;
            state.roundMessage = "";
          } else state.screen = "lobby";
          render();
          notify(`WELCOME, ${name.toUpperCase()}!`);
          return;
        }
        error.textContent = translateDynamic("Room not found in this browser demo. Create a room here first, or try the demo match.");
      }
      function updateSettingSummary() {
        const duration = document.getElementById("duration");
        if (!duration) return;
        state.duration = Number(duration.value);
        document.getElementById("summary-time").textContent = `${state.duration}:00`;
        document.querySelectorAll(".switch").forEach((button) => {
          const key = button.dataset.setting;
          button.setAttribute("aria-checked", String(state[key]));
        });
        document.getElementById("summary-attacks").textContent = tr(state.attacks ? "ON" : "OFF");
        document.getElementById("summary-powers").textContent = tr(state.powers ? "ON" : "OFF");
      }
      document.addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;
        if (button.dataset.answer !== undefined) { submitAnswer(Number(button.dataset.answer)); return; }
        if (button.dataset.move) { useMove(button.dataset.move); return; }
        const action = button.dataset.action;
        if (!action) {
          if (button.classList.contains("switch")) {
            const key = button.dataset.setting;
            state[key] = !state[key];
            updateSettingSummary();
          }
          return;
        }
        if (action === "home") goHome();
        if (action === "create") setScreen("setup");
        if (action === "join") setScreen("join");
        if (action === "demo") startDemo();
        if (action === "create-room") createRoom();
        if (action === "add-demo") {
          if (state.players.length > 1) { notify("Demo players are already in the room."); return; }
          demoPlayers.forEach((player, index) => state.players.push({
            ...player, id: `demo-${index}`, color: palette[(index + 1) % palette.length]
          }));
          render();
          notify("FOUR DEMO PLAYERS JOINED");
        }
        if (action === "start-lobby") startLobby();
        if (action === "copy-code") copyCode();
        if (action === "pause") togglePause();
        if (action === "next-question") nextQuestion();
        if (action === "end-game") finishGame();
        if (action === "rematch") resetMatch();
      });
      document.addEventListener("change", (event) => {
        if (event.target.id === "language-select") {
          const language = event.target.value;
          if (language === "en" || language === "uz" || language === "ru") {
            const joinCode = document.getElementById("join-code")?.value;
            const joinName = document.getElementById("join-name")?.value;
            state.language = language;
            localStorage.setItem("tower-clash-language", language);
            render();
            if (joinCode !== undefined) document.getElementById("join-code").value = joinCode;
            if (joinName !== undefined) document.getElementById("join-name").value = joinName;
          }
          return;
        }
        if (event.target.id === "duration") updateSettingSummary();
      });
      document.addEventListener("input", (event) => {
        if (event.target.id === "host-name") state.customName = event.target.value;
      });
      document.addEventListener("submit", (event) => {
        if (event.target.id === "join-form") {
          event.preventDefault();
          joinGame(event.target);
        }
      });
      document.addEventListener("input", (event) => {
        if (event.target.id === "join-code") {
          event.target.value = event.target.value.replace(/\D/g, "").slice(0, 6);
        }
      });
      document.addEventListener("keydown", (event) => {
        if (state.screen !== "game" || state.answerLocked || state.paused) return;
        const index = Number(event.key) - 1;
        if (index >= 0 && index < 4) submitAnswer(index);
      });
      render();
    })();
  </script>
</body>
</html>
